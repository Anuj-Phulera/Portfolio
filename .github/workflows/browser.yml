name: browser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci --prefix site

      - name: Build the site
        working-directory: site
        run: node build.ts

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      # Everything the build machine could not check: real layout, real colour
      # contrast, real focus order, real media queries, real pointer input.
      - name: Run the browser suite
        working-directory: site
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: site/test-results/shots
          if-no-files-found: warn
          retention-days: 30

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/test-results
          retention-days: 7
