name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            studio/package-lock.json
            site/package-lock.json

      - name: Install studio dependencies
        run: npm ci --prefix studio

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Run every check, including both builds
        run: bash tools/verify-all.sh --build
