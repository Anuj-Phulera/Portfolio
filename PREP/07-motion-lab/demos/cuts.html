<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lab 01 — cut timing</title>
<style>
  :root { --paper:#F4F1EA; --ink:#14110F; --grey:#6E675C; --red:#B3261E; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 Newsreader, Georgia, serif; }
  main { max-width:60rem; margin:0 auto; padding:4rem 1.5rem; }
  h1 { font-size:clamp(1.8rem,5vw,3rem); line-height:1.05; margin:0 0 1rem; }
  p.lede { color:var(--grey); max-width:38ch; }
  .stage { position:relative; height:18rem; border:1px solid var(--ink); margin:2rem 0 1rem; overflow:hidden; }
  .shot { position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(1.2rem,4vw,2rem); opacity:0; transition:opacity 160ms linear; }
  .shot.on { opacity:1; }
  .controls { display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; }
  button { font:inherit; padding:.6rem 1rem; border:1px solid var(--ink); background:transparent; color:inherit; cursor:pointer; min-height:44px; }
  button:focus-visible, a:focus-visible { outline:3px solid var(--red); outline-offset:2px; }
  .log { font:13px/1.4 ui-monospace, monospace; color:var(--grey); margin-top:1rem; white-space:pre-wrap; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<main>
  <h1>Cut timing, not scroll scrubbing</h1>
  <p class="lede">Three shots, each with a hold and a cut. The sequence is computed by <code>lib/pacing.mjs</code>; the browser only renders it. Turn on reduced motion in your OS to see the no-motion path.</p>
  <div class="stage" id="stage" aria-hidden="true">
    <div class="shot on">Shot one — the desk</div>
    <div class="shot">Shot two — the greenhouse</div>
    <div class="shot">Shot three — the door</div>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>
  <div class="controls">
    <button id="play">Play sequence</button>
    <button id="skip">Show all text</button>
    <span id="status" class="lede" role="status"></span>
  </div>
  <pre class="log" id="log"></pre>
</main>
<script type="module">
  import { buildSequence, shotAt } from '../lib/pacing.mjs';

  const sequence = buildSequence([
    { name: 'desk', hold: 900, transition: 160 },
    { name: 'greenhouse', hold: 1200, transition: 160 },
    { name: 'door', hold: 1400, transition: 160 },
  ]);

  const shots = [...document.querySelectorAll('.shot')];
  const log = document.getElementById('log');
  const live = document.getElementById('live');
  const status = document.getElementById('status');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  log.textContent = sequence.shots
    .map((s) => `${String(s.startsAt).padStart(5)}ms  ${s.name.padEnd(11)} hold ${s.hold}ms  ${s.kind}`)
    .join('\n') + `\n${String(sequence.duration).padStart(5)}ms  end`;

  let timer;
  function render(index) {
    shots.forEach((el, i) => el.classList.toggle('on', i === index));
    live.textContent = `Shot ${index + 1} of ${shots.length}`;
  }

  function play() {
    clearTimeout(timer);
    if (reduced) {
      shots.forEach((el) => el.classList.add('on'));
      status.textContent = 'Reduced motion: all shots shown at once.';
      return;
    }
    let t = 0;
    sequence.shots.forEach((shot, i) => {
      setTimeout(() => render(i), t);
      t += shot.hold;
    });
    setTimeout(() => { render(shots.length - 1); status.textContent = 'Sequence complete.'; }, t);
  }

  document.getElementById('play').addEventListener('click', play);
  document.getElementById('skip').addEventListener('click', () => {
    clearTimeout(timer);
    shots.forEach((el) => el.classList.add('on'));
    status.textContent = 'All text visible.';
  });
</script>
</body>
</html>
